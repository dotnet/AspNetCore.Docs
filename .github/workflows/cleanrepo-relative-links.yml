name: "clean repo - relative links"

on:
  schedule:
    - cron: "0 1 1 * *" # Runs at 01:00, on day 1 of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Call clean repo
      - name: Clean repo
        id: clean-repo-step
        uses: dotnet/docs-tools/cleanrepo@1792e4913167146272afc4d7ad9b7e2bf1701495 # main
        with:
          function: "ReplaceWithRelativeLinks"
          docfx_directory: "aspnetcore"
          target_directory: "aspnetcore"
          url_base_path: "/aspnet/core"

      # Create the PR for the work done by the "clean repo" tool
      - name: create-pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 #v8.1.3
        with:
          branch: cleanrepo-relative-links
          title: "Monthly chores: Use relative links"
          commit-message: "Bot 🤖 generated CleanRepo tool run"
          body: "Find and replace absolute links with relative links. Contributes to #..."
