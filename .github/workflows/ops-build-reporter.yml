name: 'OPS build reporter'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ops-build-reporter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  statuses: read

jobs:
  report:
    name: Collect OPS diagnostics and previews
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Produce report artifacts
        id: report
        uses: dotnet/docs-actions/ops-build-reporter@e92e67a4b93ea5976eea3d65af4b2082818c7045 # main
        with:
          repo_token: ${{ github.token }}

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ops-build-report
          path: ${{ steps.report.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
