name: "clean repo - redirect hops"

on:
  schedule:
    - cron: "0 1 1 * *" # Runs at 01:00, on day 1 of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Call clean repo
      - name: Clean repo
        id: clean-repo-step
        uses: dotnet/docs-tools/cleanrepo@1792e4913167146272afc4d7ad9b7e2bf1701495 # main
        with:
          function: "RemoveRedirectHops"
          docfx_directory: "aspnetcore"
          target_directory: "aspnetcore"
          url_base_path: "/aspnet/core"

      # Create the PR for the work done by the "clean repo" tool
      - name: create-pull-request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 #v8.1.2
        with:
          branch: cleanrepo-remove-hops
          title: "Monthly chores: Remove redirect hops"
          commit-message: "Bot 🤖 generated CleanRepo tool run"
          body: "Remove redirect hops, for example, if a -> b and b -> c, replace a -> b with a -> c. Contributes to #..."
